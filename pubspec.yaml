name: quizlone
description: "A modern study application"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# Read more about iOS versioning at https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.2.26+1

environment:
  # Flutter 3.50.x ships Dart 3.14.0. Declaring the floor makes an out-of-date
  # SDK fail fast with a clear message instead of a confusing transitive
  # constraint error such as "flutter_test ... is incompatible with file_saver".
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Data management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Core
  auto_route: ^11.1.0
  # Flutter 3.47 moved Material into this package. auto_route (and anything else
  # built against the new Material) resolves `Theme.of(context)` through it, so
  # the app has to provide that theme explicitly — see buildModernTheme in
  # lib/main.dart.
  material_ui: ^1.10.0
  logging: ^1.3.0
  web: ^1.1.1
  flutter_native_splash: ^2.4.8

  # Cloud database
  supabase_flutter: ^2.17.2
  async: ^2.13.0
  connectivity_plus: ^7.3.1

  # Utility
  path_provider: ^2.1.5
  package_info_plus: ^10.1.0
  file_picker: ^13.3.2
  json_annotation: ^4.12.0
  uuid: ^4.5.1
  collection: ^1.19.1
  intl: ^0.20.2
  path: ^1.9.1

  # Theme customization
  flex_color_picker: ^4.0.0

  # Animations
  flutter_animate: ^4.5.2
  animated_list_plus: ^0.5.2
  animations: ^3.0.0

  # Platform-specific
  # window_manager 0.7.x pulls nativeapi 0.6.x, which is the first release that
  # compiles on Dart 3.14 (0.5.x uses the removed Isolate.create).
  window_manager: ^0.7.1
  share_plus: ^13.1.0
  flutter_file_dialog: ^3.3.2
  file_saver: ^0.7.0

  # Localization
  slang: ^4.19.0
  slang_flutter: ^4.19.0

  # Updater
  pub_semver: ^2.2.0
  dio: ^5.9.0
  http: ^1.5.0
  open_filex: ^5.0.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2

  # Smooth scrolling
  silky_scroll: ^2.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Useful tools
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

  # Code generation
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.10
  hive_ce_generator: 1.11.2
  auto_route_generator: ^10.6.0
  json_serializable: ^6.15.2

  # Testing
  fake_async: ^1.3.3

  # Custom linting
  riverpod_lint: ^3.2.0

# analyzer is pinned to 13.x for one reason: the three code generators each
# demand a different major, and 13.x is the only lane where two of them agree.
#
#   auto_route_generator 10.6.0   analyzer >=10.0.0 <14.0.0   (no 11.x exists)
#   riverpod_generator  4.0.10    analyzer >=13.0.0 <15.0.0
#   hive_ce_generator             no release supports 13.x at all
#
# hive_ce_generator 1.11.2 declares analyzer ^12 but its generated output is
# byte-identical to 1.12.1's (verified by regenerating every adapter from
# scratch), so it is pinned there and the analyzer major is overridden to 13.3.0
# to satisfy riverpod. build_runner 2.15.1 is the newest release that still
# compiles against analyzer 13.
#
# Remove all of this once auto_route_generator ships analyzer 14 support
# (https://github.com/Milad-Akarie/auto_route_library/issues).
dependency_overrides:
  analyzer: 13.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 24

  image_path_android: "assets/icon.png"
  adaptive_icon_background: "#2644d9"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 12 # only available for Android 8.0 devices and above
  # adaptive_icon_monochrome: "assets/icon/monochrome.png" # only available for Android 13 devices and above

  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 # min:48, max:256, default: 48

  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#2644d9"
    theme_color: "#004D40"

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon.png

  color_dark: "#121212"
  image_dark: assets/icon.png

  android: true
  ios: true
  web: true

  web_image_mode: center
  fullscreen: true

  android_12:
    image: assets/icon_bg.png
    color: "#ffffff"
    color_dark: "#121212"
