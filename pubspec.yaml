name: quizlone
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# Read more about iOS versioning at https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.1.18+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Data management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1

  # Core
  auto_route: ^10.1.0+1
  logging: ^1.3.0

  # Cloud database
  supabase_flutter: ^2.10.0
  flutter_dotenv: ^6.0.0
  async: ^2.13.0
  connectivity_plus: ^7.0.0

  # Utility
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  file_picker: ^10.3.2
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  collection: ^1.19.1

  # Animations
  flutter_animate: ^4.5.2
  animated_list_plus: ^0.5.2
  animations: ^2.0.11

  # Platform-specific
  window_manager: ^0.5.0
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  flutter_file_dialog: ^3.0.2
  file_saver: ^0.3.1

  # Localization
  slang: ^4.8.1
  slang_flutter: ^4.8.0

  # Updater
  pub_semver: ^2.2.0
  dio: ^5.9.0
  http: ^1.5.0
  open_filex: ^4.7.0
  flutter_markdown_plus: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Useful tools
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.3
  hive_ce_generator: ^1.9.2
  auto_route_generator: ^10.1.0
  json_serializable: ^6.9.5
  slang_build_runner: ^4.8.0

  # Custom linting
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon_transparent.png
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 24

  image_path_android: "assets/icon_full.png"
  adaptive_icon_background: "#EDE07A"
  adaptive_icon_foreground: "assets/icon_transparent.png"
  adaptive_icon_foreground_inset: 10 # only available for Android 8.0 devices and above
  # adaptive_icon_monochrome: "assets/icon/monochrome.png" # only available for Android 13 devices and above

  windows:
    generate: true
    image_path: "assets/icon_transparent.png"
    icon_size: 48 # min:48, max:256, default: 48

  web:
    generate: true
    image_path: "assets/icon_transparent.png"
    background_color: "#EDE07A"
    theme_color: "#004D40"
