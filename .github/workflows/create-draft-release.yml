name: Build, Release, and Deploy

on:
  push:
    branches: [main]

env:
  REPO_NAME: Quizlone
  APP_NAME: Quizlone

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - name: Decode and Create Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
      - name: Create key.properties File
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../upload-keystore.jks" >> android/key.properties
      - uses: actions/setup-java@v4
        with: { distribution: "zulu", java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter clean
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs && dart run slang
      - run: flutter build apk --release --split-per-abi
      - name: Prepare APKs for Release
        run: |
          find build/app/outputs/apk/release -name "*x86_64*.apk" -delete
          cd build/app/outputs/apk/release
          for file in app-*-release.apk; do
            arch=$(echo "$file" | sed -e 's/app-//' -e 's/-release.apk//')
            new_name="${{ env.APP_NAME }}-${arch}.apk"
            mv "$file" "$new_name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/apk/release/*.apk

  build_windows:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter clean
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs && dart run slang
      - run: flutter build windows --release
      - name: Compress Portable Build
        run: |
          choco install 7zip
          7z a Windows-portable.7z ./build/windows/x64/runner/Release/*
        shell: bash

      - name: Extract App Version
        id: get_version
        run: |
          $fullVersion = (Get-Content pubspec.yaml | Select-String -Pattern "version:\s*([0-9A-Za-z\-+.]+)").Matches.Groups[1].Value.Trim()
          $cleanVersion = $fullVersion.Split('+')[0]
          echo "app_version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Detected full version: $fullVersion"
          echo "Using sanitized version for release: $cleanVersion"
        shell: powershell

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/installer_script.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            Windows-portable.7z
            scripts/output/*.exe

  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter clean
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs && dart run slang
      - run: flutter build web --wasm --release --base-href /${{ env.REPO_NAME }}/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy_web:
    runs-on: ubuntu-latest
    needs: build_web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create_release:
    runs-on: ubuntu-latest
    needs: [build_android, build_windows]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            artifacts/**/*.apk
            artifacts/**/*.7z
            artifacts/**/*.exe
          draft: true
          allowUpdates: true
          tag: "dev-build-${{ github.run_number }}"
          name: "${{ env.APP_NAME }} v${{ needs.build_windows.outputs.app_version }}"
          body: |
            Automated development build.
            Triggered by commit: `${{ github.sha }}`
