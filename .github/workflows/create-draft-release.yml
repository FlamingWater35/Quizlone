name: Build, Release, and Deploy

on:
  push:
    branches: [main]

env:
  REPO_NAME: Quizlone

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - uses: actions/setup-java@v3
        with: { distribution: "zulu", java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter clean
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs && dart run slang
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/apk/release/*.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter clean
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs && dart run slang
      - run: flutter build windows --release
      - run: choco install 7zip
      - run: 7z a Windows-portable.7z ./build/windows/x64/runner/Release/*
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Windows-portable.7z

  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter clean
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs && dart run slang
      - run: flutter build web --wasm --release --base-href /${{ env.REPO_NAME }}/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web
      - name: Zip Web Build for Release
        run: zip -r web-build.zip ./build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-build-zip
          path: web-build.zip

  deploy_web:
    runs-on: ubuntu-latest
    needs: build_web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create_release:
    runs-on: ubuntu-latest
    needs: [build_android, build_windows, build_web]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "artifacts/**/*"
          draft: true
          allowUpdates: true
          tag: "dev-build-${{ github.run_number }}"
          name: "Development Build ${{ github.run_number }}"
          body: |
            Automated development build.
            Triggered by commit: `${{ github.sha }}`
