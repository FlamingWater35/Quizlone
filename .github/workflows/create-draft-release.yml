name: Build, Release, and Deploy

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

env:
  REPO_NAME: Quizlone
  APP_NAME: Quizlone
  DART_DEFINES: --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  build_android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - name: Decode and Create Keystore File
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
      - name: Create key.properties File
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../upload-keystore.jks" >> android/key.properties
      - uses: actions/setup-java@v5
        with: { distribution: "temurin", java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter pub get
      - run: dart run build_runner build && dart run slang
      - run: flutter build apk --release --split-per-abi ${{ env.DART_DEFINES }}
      - name: Prepare APKs for Release
        run: |
          find build/app/outputs/apk/release -name "*x86_64*.apk" -delete
          cd build/app/outputs/apk/release
          shopt -s nullglob
          for file in app-*-release.apk; do
            arch=$(echo "$file" | sed -e 's/app-//' -e 's/-release.apk//')
            new_name="${{ env.APP_NAME }}-${arch}.apk"
            mv "$file" "$new_name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/apk/release/*.apk

  build_windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      app_version: ${{ steps.get_version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter pub get
      - run: dart run build_runner build && dart run slang
      - run: flutter build windows --release ${{ env.DART_DEFINES }}
      - name: Compress Portable Build
        run: |
          choco install 7zip
          7z a "${{ env.APP_NAME }}-Windows-portable.7z" ./build/windows/x64/runner/Release/*
        shell: bash
      - name: Extract App Version
        id: get_version
        run: |
          $fullVersion = (Get-Content pubspec.yaml | Select-String -Pattern "version:\s*([0-9A-Za-z\-+.]+)").Matches.Groups[1].Value.Trim()
          $cleanVersion = $fullVersion.Split('+')[0]
          echo "app_version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: powershell
      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: scripts/installer_script.iss
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ${{ env.APP_NAME }}-Windows-portable.7z
            scripts/output/*.exe

  build_linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libfuse2
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter pub get
      - run: dart run build_runner build && dart run slang
      - run: flutter build linux --release ${{ env.DART_DEFINES }}
      - name: Create Portable Tarball
        run: tar -czvf ${{ env.APP_NAME }}-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Install AppImageTool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          EXECUTABLE_NAME=$(find build/linux/x64/release/bundle -maxdepth 1 -type f -executable -exec basename {} \; | grep -v '\.so$')

          cat <<EOF > AppDir/AppRun
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          cd "\${HERE}/usr/bin"
          exec "./${EXECUTABLE_NAME}" "\$@"
          EOF

          chmod +x AppDir/AppRun
          echo "[Desktop Entry]
          Name=${{ env.APP_NAME }}
          Exec=AppRun
          Type=Application
          Terminal=false
          Icon=${EXECUTABLE_NAME}
          Categories=Utility;" > AppDir/${EXECUTABLE_NAME}.desktop

          cp assets/icon.png AppDir/${EXECUTABLE_NAME}.png
          ./appimagetool-x86_64.AppImage AppDir ${{ env.APP_NAME }}-linux.AppImage
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            ${{ env.APP_NAME }}-linux.tar.gz
            ${{ env.APP_NAME }}-linux.AppImage

  build_web:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: "stable", cache: true }
      - run: flutter pub get
      - run: dart run build_runner build && dart run slang
      - run: flutter build web --release --wasm --base-href /${{ env.REPO_NAME }}/ ${{ env.DART_DEFINES }}
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy_web:
    runs-on: ubuntu-latest
    needs: build_web
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create_release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_android, build_windows, build_linux]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Display structure of downloaded files
        run: ls -R artifacts
      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "artifacts/**/*.apk,artifacts/**/*.7z,artifacts/**/*.exe,artifacts/**/*.tar.gz,artifacts/**/*.AppImage"
          draft: true
          allowUpdates: true
          tag: ${{ github.ref_name }}
          name: "Version ${{ needs.build_windows.outputs.app_version }}"
          body: "Automated build triggered by commit: `${{ github.sha }}`"
